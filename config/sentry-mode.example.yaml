node:
  name: sentry-mode
camera:
  enabled: true
  device: 0
  width: 1920
  height: 1080
  fps: 30
  fourcc: MJPG
  exposure: 0
microphone:
  enabled: true
  device: auto
speaker:
  enabled: true
  device: auto
  volume: 70
  pipewire_latency_ms: 250
logging:
  level: INFO
speech:
  enabled: true
  engine: auto
  kokoro_directory: models/kokoro
  speakers:
    en: af_heart
    it: if_sara
  lead_in_ms: 1000
  tail_ms: 750
  talk_gain_db: 15
  voice: en
  rate: 175
detection:
  enabled: false
  model: models/yolox/yolox_nano.onnx
  confidence: 0.45
  max_fps: 2
  # Inferences a second for every camera together; one camera at up to 10 FPS is not slowed.
  budget_fps: 10
  # "process" runs the model in a child process that is replaced if it stops answering.
  isolation: thread
  inference_timeout_seconds: 10
sentry_state_file: .local/sentry.json
# Sentry photos and videos; only the newest 200 files are kept.
captures_directory: .local/captures
# Exact dashboard origins allowed to embed this app; empty blocks embedding.
web_frame_origins: []
sentry:
  test_mode: false
  detection_fps: 2
  action_ttl_seconds: 15
  rules:
    - name: Person at entrance
      enabled: true
      object: person
      min_confidence: 0.7
      consecutive_detections: 3
      rearm_after_absence_seconds: 10
      cooldown_seconds: 60
      actions:
        - type: tts
          text: Hello. Please wait here.
          voice: en
          effects:
            preset: natural
            volume: 60
  ssh_commands: {}
  # Configure in the HTTPS web editor; keep real tokens out of tracked YAML.
  telegram:
    bot_token: ""
    chat_id: ""
  # Additional rule action:
  # - type: telegram
  #   text: Sentry detected a person at the entrance.
  #   silent: false
