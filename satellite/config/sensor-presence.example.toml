# A board with sensors and Bluetooth presence. Copy to /etc/sentry-satellite/node.toml.
# Pins and debounce are examples: verify them against the sensor actually wired up.

[node]
id = "zero-entrance"
profile = "sensor-presence"

[hub]
mqtt_host = "192.168.11.10" # the Pi 5 on the dedicated network, never a loopback address
mqtt_port = 8883
protocol = 5

[tls]
ca_file = "/etc/sentry-satellite/ca.crt"
cert_file = "/etc/sentry-satellite/node.crt"
key_file = "/etc/sentry-satellite/node.key"

[limits]
event_max_count = 256
event_max_bytes = 1048576
event_max_age_seconds = 300
heartbeat_seconds = 15

[[sources]]
id = "pir-1"
kind = "gpio"
line_numbering = "bcm"
line = 17
active_high = true
debounce_ms = 100

# One device watched over Bluetooth LE: a beacon or a tag whose address does not change.
# Nothing else is collected, and the address stays on this board: the hub is told only
# that this source is present, absent or unknown. Bluetooth scanning is not qualified on
# a board that also streams video or sound, so it is refused there.
[[sources]]
id = "presence"
kind = "ble"
address = "AA:BB:CC:DD:EE:FF" # or ibeacon_uuid = "…" for a beacon that moves address
rssi_min = -95               # weaker than this is another room, not this one
enter_sightings = 3          # sightings, a second or more apart, to call it present
enter_window_seconds = 10.0
absent_after_seconds = 120.0 # of scanning without a sighting; a scanner that stops says unknown
