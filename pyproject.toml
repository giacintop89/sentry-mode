[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentry-mode"
version = "0.1.0"
description = "Headless, local-first Raspberry Pi hardware node"
requires-python = ">=3.11"
dependencies = ["opencv-python-headless>=4.8", "PyYAML>=6", "pydantic>=2", "pydantic-settings>=2"]

[project.optional-dependencies]
speech = ["kokoro-onnx>=0.6,<1"]
satellites = ["paho-mqtt>=2,<3"]
# pyserial is what `firmware/pico/tools/board_check.py` talks to a board over; nothing the
# hub itself runs needs a serial port.
dev = ["pytest>=8", "pytest-cov", "ruff", "mypy", "types-PyYAML", "pyserial>=3.5"]

[project.scripts]
sentry-mode = "sentry_mode.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sentry_mode = ["*.html", "*.js", "*.css"]
"sentry_mode.satellites" = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib -m 'not hardware'"
markers = ["hardware: explicitly invoked physical hardware tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
