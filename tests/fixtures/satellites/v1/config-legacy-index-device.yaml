# V1 baseline: camera addressed by index, the shape config/sentry-mode.example.yaml ships.
# Recorded before any satellite work so a migration can be proved lossless.
node:
  name: sentry-mode
camera:
  enabled: true
  device: 0
  width: 1920
  height: 1080
  fps: 30
microphone:
  enabled: true
  device: auto
speaker:
  enabled: true
  device: auto
  volume: 70
  pipewire_latency_ms: 250
logging:
  level: INFO
speech:
  enabled: true
  engine: auto
  kokoro_directory: models/kokoro
  speakers:
    en: af_heart
    it: if_sara
  lead_in_ms: 1000
  tail_ms: 750
  voice: en
  rate: 175
detection:
  enabled: false
  model: models/yolox/yolox_nano.onnx
  confidence: 0.45
  max_fps: 2
sentry_state_file: .local/sentry.json
captures_directory: .local/captures
web_frame_origins: []
